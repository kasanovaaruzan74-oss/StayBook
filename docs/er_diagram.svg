<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1330" viewBox="0 0 1800 1330" role="img" aria-labelledby="title description">
<title id="title">StayBook дерекқорының ER сызбасы</title>
<desc id="description">Қонақтар, нөмір санаттары, қонақүй нөмірлері және брондаулар. Үш бірден көпке байланыс.</desc>
